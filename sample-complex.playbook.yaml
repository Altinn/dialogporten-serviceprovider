playbook:
  party: urn:altinn:person:identifier-no:08895699684
  service-resource: urn:altinn:resource:ttd-dialogporten-automated-tests
  language: en
  start: draft

  stages:
    draft:
      title: Apply for a business permit
      status: Draft
      extended-status: Not started
      additional-info: |
        ## Welcome
        This short application registers your business with the trade register. Plan on about 10 minutes.
      content: welcome
      actions:
        - Start application → next

    choose:
      title: Choose business type
      additional-info: |
        ### Pick the entity type
        Your answer determines what paperwork we need.
      content: biz-types
      actions:
        - Sole proprietorship → soleprop
        - Limited company → ltdco
        - Other → other
        - Back → previous

    soleprop:
      title: Sole proprietorship — basic info
      status: InProgress
      extended-status: Filling in
      additional-info: |
        ### Sole proprietorship
        We'll need your personal ID number, the trade name, and the planned start date.
      content: soleprop-form
      transmissions:
        - type: Information
          from: Trade register — tax desk
          title: Tax registration
          summary: Sole props are automatically registered for VAT once turnover exceeds NOK 50,000.
          content: soleprop-tax
      activity: DialogOpened
      actions:
        - Continue to review → review
        - Change business type → choose

    ltdco:
      title: Limited company — basic info
      status: InProgress
      extended-status: Filling in
      additional-info: |
        ### Limited company
        We'll need the company name, articles of association, board members, and the registered office.
      content: ltdco-form
      transmissions:
        - type: Information
          from: Trade register
          title: Board documentation
          summary: "Have your founding meeting minutes ready — you'll upload them at the review step."
          content: ltdco-board
      activity: DialogOpened
      actions:
        - Continue to review → review
        - Change business type → choose

    other:
      title: Other business type — contact required
      status: InProgress
      extended-status: Manual review needed
      additional-info: |
        ### Custom registration
        For cooperatives, foundations, NGOs and similar, a case worker has to look at your structure individually.
      content: other-contact
      activity: DialogOpened
      actions:
        - "I've made contact — continue → review"
        - Change business type → choose

    review:
      title: Review and submit
      status: InProgress
      extended-status: Ready to submit
      additional-info: |
        ### Final check
        Review the summary and submit when you're ready. Submitting locks the application — you can still respond to follow-up requests later.
      content: review
      activity:
        type: Information
        description: Reached review step.
      actions:
        - Submit application → next
        - Change something → choose

    submitted:
      title: Submitted — in queue
      status: Awaiting
      extended-status: Awaiting case worker
      additional-info: |
        ## Submitted
        Your application is in the queue. Expected response time: 5–7 business days. We'll send any follow-up questions as a transmission below.
      content: receipt
      transmissions:
        - type: Submission
          from: Trade register service desk
          title: Receipt
          summary: Reference REF-2026-3142 — keep this for your records.
          content: receipt-tx
      activity: FormSubmitted
      actions:
        - "Simulate: case worker has questions → next"
        - "Simulate: approved directly → approved"
        - Restart → draft

    more-info:
      title: Additional information required
      status: RequiresAttention
      extended-status: Action required
      additional-info: |
        ## Action required
        The case worker needs a few more documents before approving. See the request transmission below and the checklist in the main view.
      content: docs-needed
      transmissions:
        - type: Request
          from: Anders Holm, case worker
          title: Documentation request
          summary: Please upload proof of address and articles of association by reply within 14 days.
          content: docs-request
      activity:
        type: Information
        description: Case worker requested additional documentation.
      actions:
        - Send additional docs → next
        - Back → previous

    docs-received:
      title: Docs received — final review
      status: Awaiting
      extended-status: Final review
      additional-info: |
        ## Thanks
        Your documents are with the case worker. Final decision arrives in about 2 business days.
      content: final-review
      transmissions:
        - type: Acceptance
          from: Anders Holm, case worker
          title: Docs received
          summary: "We've received your additional documentation and started the final review."
          content: docs-received-tx
      activity: FormSubmitted
      actions:
        - See decision → next

    approved:
      title: Permit approved
      status: Completed
      extended-status: Approved
      additional-info: |
        ## Decision: Approved
        Your business is now registered. The permit number and effective date are in the decision document. Restart the demo from stage 0 if you want to walk it again — note that transmissions and activities accumulate across cycles.
      content: decision
      transmissions:
        - type: Decision
          from: Trade register — decisions desk
          title: Decision document
          summary: Permit number BP-2026-77231. Effective 2026-06-15.
          content: decision-doc-tx
      activity: DialogClosed
      actions:
        - Restart demo → draft

  fce:
    welcome: |
      # Welcome to the business permit demo

      This playbook walks through a fictional business-registration application. You'll choose an entity type, fill in details, submit, and either receive a follow-up request or a direct decision.

      ## What you'll see

      - A **draft → in progress → awaiting → requires attention → completed** status trajectory
      - A **branching path** at stage 1 (sole proprietorship vs limited company vs other)
      - **Transmissions** of types `Information`, `Submission`, `Request`, `Acceptance`, `Decision`
      - **Activities** logged at key transitions
      - **Front-channel embeds** like this one, each named and resolved via the playbook's state id

      Click **Start application** below to begin.

    biz-types: |
      # Choose entity type

      Pick the one that fits your situation. You can change later by clicking **Change business type** on the next screen.

      | Type | Best for | Setup time |
      |---|---|---|
      | **Sole proprietorship** | One owner, low risk, simple bookkeeping | Same day |
      | **Limited company** | Multiple founders, capital, liability protection | 2–3 weeks |
      | **Other** | Cooperative, foundation, NGO, association | Case-by-case |

      Not sure? Pick *Other* and a case worker will help.

    soleprop-form: |
      # Sole proprietorship details

      In a real application this view would be an actual form. For the demo we'll just describe what we'd ask for.

      ## Required fields

      - **Personal ID number** (national identity number)
      - **Trade name** — must include your surname
      - **Planned start date**
      - **NACE / industry code**
      - **Estimated annual turnover** (used to determine VAT registration)
      - **Registered address**

      ## Optional

      - Bookkeeping software you'll use
      - Whether you'll have any employees in year one

    soleprop-tax: |
      # Tax registration — sole proprietorship

      ## VAT (mva)

      You'll be auto-registered for VAT once your **12-month turnover crosses NOK 50,000**. Until then you neither charge nor reclaim VAT.

      ## Income tax

      Profits are taxed as personal income at marginal rates. You'll get a pre-filled tax form each March based on what you report.

      ## Reporting deadlines

      - VAT (once registered): bi-monthly
      - Annual income statement: April 30

      You'll find templates in Altinn once your business number is issued.

    ltdco-form: |
      # Limited company details

      In a real application this view would be the company-formation form. For the demo, here's what we'd ask for.

      ## Required

      - **Company name** — must be unique and end with `AS` (or equivalent)
      - **Articles of association** — PDF upload
      - **Share capital** — minimum NOK 30,000
      - **Founders** — names and ID numbers
      - **Board members** — chair and at least one regular member
      - **Registered office** — Norwegian address
      - **Auditor** (or declaration of exemption if eligible)

      ## You'll upload at review

      - Founding meeting minutes
      - Bank confirmation of share capital deposit

    ltdco-board: |
      # Board documentation requirements

      ## Founding meeting minutes

      The minutes must include:

      - Date, time, location
      - Founders present
      - Decision to form the company
      - Adoption of articles of association
      - Election of board members
      - Decision on share capital and how it's paid

      ## Format

      Signed PDF, max 10 MB. Multi-page is fine.

      ## Bank confirmation

      A signed letter from the bank confirming the share capital is deposited in an account in the company's name.

    other-contact: |
      # Other business types

      Cooperatives, foundations, religious bodies, and NGOs each have their own paths — too varied for a self-service form.

      ## What happens next

      1. **Email** us at `business-help@example.org` with a short description (2–3 paragraphs) of your structure and purpose.
      2. A case worker will **respond within 3 business days** with a tailored checklist.
      3. Once the checklist is complete you'll come back here, click **I've made contact — continue**, and we'll route the rest through this dialog.

    review: |
      # Review summary

      ## What we have

      *(In a real application, this would be a read-only render of everything filled in so far.)*

      - Entity type
      - Trade name / company name
      - Founders / sole proprietor
      - Address
      - Industry code
      - Tax / VAT election
      - Attached documents (if any)

      ## Before you submit

      - Submission locks the application — edits afterward require contacting the case worker.
      - You'll get a receipt with a reference number you can use in any correspondence.
      - A case worker may come back with follow-up questions — you'll see them in this dialog.

    receipt: |
      # Status: in queue

      Your application is **REF-2026-3142**. Estimated processing time **5–7 business days**.

      ## What happens now

      1. A case worker picks up your application from the queue
      2. They review the docs and either approve or ask for more
      3. You'll see any follow-up requests as a **transmission** in this dialog
      4. You'll get the final decision via a **Decision** transmission and the dialog will move to **Completed**

      *This is a demo, so to keep things fast you can simulate either branch using the buttons below.*

    receipt-tx: |
      # Receipt — REF-2026-3142

      **Received** 2026-06-06 at 14:22 (UTC)

      **From** Trade register service desk
      **To** Applicant

      ## Contents

      - Application form
      - Attachments (none required for sole prop; otherwise see below)
      - Tax registration election

      ## Keep this reference handy

      Use `REF-2026-3142` when contacting us about this application. It's also stored in your transmission history above.

    docs-needed: |
      # Documents needed

      The case worker has reviewed your application and needs a couple more things.

      ## Checklist

      - [ ] **Proof of address** — utility bill or bank statement, less than 3 months old
      - [ ] **Articles of association** — signed PDF (only if you formed a limited company)
      - [ ] **ID document** — passport or national ID, front page

      Upload each as a separate file. Max 10 MB each.

      ## Deadline

      **14 days** from when you received this request. If we don't hear back the application is automatically rejected and you'll need to start over.

      Click **Send additional docs** below to simulate uploading.

    docs-request: |
      # Request from case worker

      Hi,

      I'm reviewing your business permit application and need a few extra documents to verify your identity and confirm the company structure. The full list is on the main view.

      A few notes:

      - The **address proof** doesn't have to be in your name if you can show a letter from the household head confirming you live there.
      - For the **articles of association** I just need the signed final version — drafts aren't enough.
      - The **ID document** should be valid (not expired).

      Reply by attaching the documents at the bottom of this dialog. Aim for within 14 days so we don't have to close the application.

      — Case worker

    final-review: |
      # Final review

      Your additional documents have been received and the case worker is now finalising the decision.

      ## What we're checking

      - Document authenticity (we cross-check the address proof and ID against population register data)
      - Articles of association — consistency with the form data you submitted
      - No conflicting registrations

      ## Timing

      Most final reviews complete within **2 business days**. You'll get a `Decision` transmission and the dialog status moves to **Completed**.

    docs-received-tx: |
      # Documents received

      All requested documents have been received and look complete. Thanks for the quick turnaround.

      We're moving the application to final review. Expect a decision within **2 business days**.

      No action required from you.

    decision: |
      # Decision: Approved

      Your business is now registered.

      ## Key details

      - **Permit number** `BP-2026-77231`
      - **Effective date** 2026-06-15
      - **Tax registration** enabled
      - **Registry status** Active

      The formal decision document is attached as a transmission below. Save it for your records — banks and insurance providers will ask to see it.

      ## Next steps

      1. Open a business bank account using the permit number
      2. Register for VAT once turnover exceeds the threshold (see the earlier tax-registration FCE)
      3. Submit your annual income statement by April 30

      ## Appeals

      This decision can be appealed within **30 days** of the effective date. To appeal, open a new dialog with the trade register service desk.

    decision-doc-tx: |
      # DECISION — Business permit

      **Permit number** BP-2026-77231
      **Case reference** REF-2026-3142
      **Decision date** 2026-06-13
      **Effective from** 2026-06-15

      ## Granted

      The trade register hereby grants a business permit under the terms applied for. The permit is unconditional and does not require periodic renewal as long as the entity remains in good standing.

      ## Conditions

      - Annual filing obligations as set out in the registration confirmation
      - Notification of any change in registered address within 30 days
      - VAT registration triggered automatically at turnover threshold

      ## Appeals

      30 days from the effective date. Address: Appeals committee, trade register.

      *This is a fictional decision generated by the dialogporten-serviceprovider playbook demo.*

