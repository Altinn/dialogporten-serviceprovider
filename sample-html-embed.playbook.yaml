playbook:
  party: urn:altinn:person:identifier-no:23905497111
  service-resource: urn:altinn:resource:ttd-dialogporten-automated-tests
  language: en
  start: start

  initial:
    title: Order 2026-04471 — awaiting confirmation
    summary: A single-dialog demo of an HTML front channel embed with a table and an image.

  vars:
    customer: "Nordvik Anlegg AS"
    order_id: "2026-04471"
    qty_pump: 2
    qty_hose: 12
    total: 24980
    reference: 0
    _seed: "html-embed-demo"

  stages:
    start:
      title: "Order {vars.order_id} — awaiting confirmation"
      summary: "The main content is an HTML front channel embed: a styled table plus an inline <img> tag."
      status: RequiresAttention
      extended-status: Awaiting confirmation
      content: order-html
      additional-info: |
        The block above this text is a front channel embed served as `text/html`
        from `/fce/named/{stateId}/order-html`. It contains a `<table>` and an
        `<img>` whose source is a self-contained `data:` URI, so nothing is
        fetched from another host.
      actions:
        - Confirm the order → confirmed
        - label: Run the remote-image probe
          target: remote-probe
          priority: secondary

    remote-probe:
      title: "Order {vars.order_id} — image probe"
      summary: Three <img> tags side by side, to see which sources survive sanitising and CSP.
      status: InProgress
      extended-status: Image probe
      content: probe-html
      additional-info: |
        Each cell below holds one `<img>` with a different kind of source.
        Whatever renders as a broken image was stripped or blocked on the way in.
      actions:
        - Confirm the order → confirmed
        - label: Back to the order
          target: start
          priority: secondary

    confirmed:
      title: "Order {vars.order_id} — confirmed"
      summary: "Confirmation receipt, again as HTML: a totals table and the same inline image."
      status: Completed
      extended-status: Confirmed
      content: receipt-html
      effects:
        - roll reference = 1000..9999
      additional-info: |
        Confirmation reference **{vars.reference}** was rolled on entry and
        interpolated into the HTML body when the embed was loaded.
      activity: DialogClosed
      actions:
        - Start over → start

  fce:
    order-html:
      media-type: text/html
      content: |
        <div style="font-family: system-ui, sans-serif; color: #1a1a1a; padding: 8px 4px;">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <img
              alt="Nordvik Anlegg logo"
              width="48"
              height="48"
              src="data:image/svg+xml;base64,">
            <div>
              <div style="font-size: 18px; font-weight: 600;">Order {vars.order_id}</div>
              <div style="color: #555;">{vars.customer}</div>
            </div>
          </div>

          <table style="border-collapse: collapse; width: 100%; font-size: 14px;">
            <caption style="text-align: left; padding-bottom: 8px; color: #555;">
              Order lines awaiting confirmation
            </caption>
            <thead>
              <tr style="background: #eef3f9;">
                <th style="text-align: left; padding: 8px; border: 1px solid #c9d6e4;">Article</th>
                <th style="text-align: right; padding: 8px; border: 1px solid #c9d6e4;">Qty</th>
                <th style="text-align: right; padding: 8px; border: 1px solid #c9d6e4;">Unit price</th>
                <th style="text-align: right; padding: 8px; border: 1px solid #c9d6e4;">Line total</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">Submersible pump, 1.5 kW</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4; text-align: right;">{vars.qty_pump}</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4; text-align: right;">9 490</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4; text-align: right;">18 980</td>
              </tr>
              <tr style="background: #fafafa;">
                <td style="padding: 8px; border: 1px solid #c9d6e4;">Discharge hose, 2" (metres)</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4; text-align: right;">{vars.qty_hose}</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4; text-align: right;">500</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4; text-align: right;">6 000</td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="3" style="padding: 8px; border: 1px solid #c9d6e4; font-weight: 600;">Total ex. VAT</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4; text-align: right; font-weight: 600;">{vars.total}</td>
              </tr>
            </tfoot>
          </table>
        </div>

    probe-html:
      media-type: text/html
      content: |
        <div style="font-family: system-ui, sans-serif; color: #1a1a1a; padding: 8px 4px;">
          <table style="border-collapse: collapse; width: 100%; font-size: 14px;">
            <caption style="text-align: left; padding-bottom: 8px; color: #555;">
              Which image sources render inside the embed?
            </caption>
            <thead>
              <tr style="background: #eef3f9;">
                <th style="text-align: left; padding: 8px; border: 1px solid #c9d6e4;">Source kind</th>
                <th style="text-align: left; padding: 8px; border: 1px solid #c9d6e4;">Image</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding: 8px; border: 1px solid #c9d6e4;"><code>data:image/svg+xml</code></td>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">
                  <img
                    alt="inline SVG data URI"
                    width="40"
                    height="40"
                    src="data:image/svg+xml;base64,">
                </td>
              </tr>
              <tr style="background: #fafafa;">
                <td style="padding: 8px; border: 1px solid #c9d6e4;"><code>data:image/gif</code> (1&times;1 pixel, scaled)</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">
                  <img
                    alt="inline GIF data URI"
                    width="40"
                    height="40"
                    style="background: #ddd;"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                </td>
              </tr>
              <tr>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">Remote <code>https://</code> URL</td>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">
                  <img
                    alt="remote image (blocked if the embed forbids external assets)"
                    width="40"
                    height="40"
                    src="https://http.cat/images/100.jpg">
                </td>
              </tr>
            </tbody>
          </table>
        </div>

    receipt-html:
      media-type: text/html
      content: |
        <div style="font-family: system-ui, sans-serif; color: #1a1a1a; padding: 8px 4px;">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <img
              alt="Nordvik Anlegg logo"
              width="48"
              height="48"
              src="data:image/svg+xml;base64,">
            <div>
              <div style="font-size: 18px; font-weight: 600;">Order confirmed</div>
              <div style="color: #555;">Reference {vars.reference}</div>
            </div>
          </div>

          <table style="border-collapse: collapse; width: 100%; font-size: 14px;">
            <tbody>
              <tr>
                <th style="text-align: left; padding: 8px; border: 1px solid #c9d6e4; background: #eef3f9;">Order</th>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">{vars.order_id}</td>
              </tr>
              <tr>
                <th style="text-align: left; padding: 8px; border: 1px solid #c9d6e4; background: #eef3f9;">Customer</th>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">{vars.customer}</td>
              </tr>
              <tr>
                <th style="text-align: left; padding: 8px; border: 1px solid #c9d6e4; background: #eef3f9;">Confirmation reference</th>
                <td style="padding: 8px; border: 1px solid #c9d6e4;">{vars.reference}</td>
              </tr>
              <tr>
                <th style="text-align: left; padding: 8px; border: 1px solid #c9d6e4; background: #eef3f9;">Total ex. VAT</th>
                <td style="padding: 8px; border: 1px solid #c9d6e4; font-weight: 600;">{vars.total}</td>
              </tr>
            </tbody>
          </table>
        </div>
